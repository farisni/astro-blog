name: Sync Obsidian Linux notes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-obsidian-linux
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Astro blog
        uses: actions/checkout@v7
        with:
          ref: main
          path: site

      - name: Checkout Obsidian Linux whitelist
        uses: actions/checkout@v7
        with:
          repository: farisni/obsidian
          ref: main
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}
          path: vault
          sparse-checkout: Linux
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Sync whitelist notes
        working-directory: site
        run: node scripts/sync-obsidian.mjs "$GITHUB_WORKSPACE/vault/Linux"

      - name: Validate generated content
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm astro check

      - name: Commit generated posts
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/linux
          if git diff --cached --quiet; then
            echo "No public note changes to commit."
            exit 0
          fi
          git commit -m "content: 同步 Obsidian Linux 笔记"
          git push
