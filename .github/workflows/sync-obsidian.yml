name: Sync Obsidian whitelist notes

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-obsidian-whitelist
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Astro blog
        uses: actions/checkout@v7
        with:
          ref: main
          path: site

      - name: Export Obsidian whitelist
        env:
          VAULT_DEPLOY_KEY: ${{ secrets.VAULT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$VAULT_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan github.com > "$known_hosts_file" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file"
          mkdir -p "$GITHUB_WORKSPACE/vault-repo" "$GITHUB_WORKSPACE/vault"
          git -C "$GITHUB_WORKSPACE/vault-repo" init --quiet
          git -C "$GITHUB_WORKSPACE/vault-repo" remote add origin \
            git@github.com:farisni/obsidian.git
          git -C "$GITHUB_WORKSPACE/vault-repo" fetch \
            --filter=blob:none \
            --depth=1 \
            origin main
          git -C "$GITHUB_WORKSPACE/vault-repo" archive \
            FETCH_HEAD -- faris-vault/Linux faris-vault/汇编 \
            | tar -x --strip-components=1 -C "$GITHUB_WORKSPACE/vault"
          test -d "$GITHUB_WORKSPACE/vault/Linux"
          test -d "$GITHUB_WORKSPACE/vault/汇编"
          unset VAULT_DEPLOY_KEY GIT_SSH_COMMAND

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Sync whitelist notes
        working-directory: site
        run: node scripts/sync-obsidian-whitelist.mjs "$GITHUB_WORKSPACE/vault"

      - name: Validate generated content
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm astro check

      - name: Commit generated posts
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/linux content/posts/assembly
          if git diff --cached --quiet; then
            echo "No public note changes to commit."
            exit 0
          fi
          git commit -m "content: 同步 Obsidian 白名单笔记"
          git push
